# Wariant z "rozgrzewką" od demonstracji heurystyki actuated (behavioral cloning).
# Agent zaczyna od poziomu heurystyki zamiast od losowej polityki, a PPO poprawia ją dalej.
# Wymaga pliku Assets/Demonstrations/TrafficSignal.demo (patrz Training/README.md, krok "Demonstracje").
behaviors:
  TrafficSignal:
    trainer_type: ppo
    hyperparameters:
      batch_size: 128
      buffer_size: 2048
      learning_rate: 3.0e-4
      beta: 3.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 4
      learning_rate_schedule: linear
      beta_schedule: linear
      epsilon_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.97
        strength: 1.0
    behavioral_cloning:
      demo_path: Assets/Demonstrations/TrafficSignal.demo
      strength: 0.5           # siła naśladowania na początku...
      steps: 60000            # ...wygasa liniowo do 0 po tylu krokach – potem już tylko nagroda
      batch_size: 128
      num_epoch: 3
    max_steps: 300000
    time_horizon: 128
    summary_freq: 2000
    checkpoint_interval: 20000
    keep_checkpoints: 15
    threaded: false

environment_parameters:
  demand_scale:
    sampler_type: uniform
    sampler_parameters:
      min_value: 0.7
      max_value: 1.3
  hour_index:
    sampler_type: uniform
    sampler_parameters:
      min_value: 0.0
      max_value: 3.999
  episode_length: 1200
